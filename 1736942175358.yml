rule-providers:
  # geosite 没有「本机应用」分类，保留这个 provider
  applications:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400

rules:
  # ===== 自定义补丁（最高优先级，修正 geosite 偶发盲区）=====
  # 飞书/Lark 主域 —— 上次踩坑，保留作为安全网
  - DOMAIN-SUFFIX,feishu.cn,DIRECT
  - DOMAIN-SUFFIX,feishu.com,DIRECT
  - DOMAIN-SUFFIX,larksuite.com,DIRECT
  - DOMAIN-SUFFIX,larkoffice.com,DIRECT
  - DOMAIN-KEYWORD,bytedance,DIRECT

  # ===== 局域网 / 本机应用直连 =====
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - RULE-SET,applications,DIRECT

  # ===== 广告拦截（如误伤可注释掉这条）=====
  - GEOSITE,category-ads-all,REJECT

  # ===== Apple / iCloud 国内外分流 =====
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,icloud-cn,DIRECT
  - GEOSITE,apple,🍎苹果服务
  - GEOSITE,icloud,🍎苹果服务

  # ===== 流媒体 / 社交 分组路由 =====
  - GEOSITE,bilibili,🎬哔哩哔哩
  - GEOSITE,youtube,🎬Youtube
  - GEOSITE,netflix,🎬Netflix
  - GEOSITE,disney,🎬Netflix
  - GEOSITE,hbo,🎬国外媒体
  - GEOSITE,spotify,🎬国外媒体
  - GEOSITE,telegram,✈️Telegram
  - GEOIP,telegram,✈️Telegram,no-resolve

  # ===== 国外常用服务 =====
  - GEOSITE,google,🔰国外流量
  - GEOSITE,microsoft,🔰国外流量
  - GEOSITE,github,🔰国外流量
  - GEOSITE,openai,🔰国外流量
  - GEOSITE,gfw,🔰国外流量
  - GEOSITE,greatfire,🔰国外流量

  # ===== 非 .cn 海外域名兜底（替代 tld-not-cn，更精准）=====
  - GEOSITE,geolocation-!cn,🔰国外流量

  # ===== 国内域名 / IP 直连（geosite:cn 含飞书等主流国内服务）=====
  - GEOSITE,cn,DIRECT
  - GEOIP,cn,DIRECT,no-resolve

  # ===== 最终兜底 =====
  - MATCH,⚓️其他流量
