mixed-port: 10809
allow-lan: false
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geodata-loader: memconservative
geox-url:
  geoip: "https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://cdn.jsdmirror.com/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"
global-client-fingerprint: chrome
find-process-mode: strict
keep-alive-interval: 30
external-controller: '127.0.0.1:9090'
# 占位：请替换为长随机字符串。如果保持空字符串，任何能访问 9090 端口的进程都能控制 clash 内核
secret: 'replace-with-a-long-random-secret-min-32-chars'

profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  listen: '127.0.0.1:1053'
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    # 局域网
    - '*.lan'
    - '*.local'
    - '+.lan'
    - '+.local'
    # Windows 网络连通性检测
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'dns.msftncsi.com'
    - 'www.msftncsi.com'
    - 'www.msftconnecttest.com'
    # QQ 登录回调
    - 'localhost.ptlogin2.qq.com'
    # Apple 推送 / iCloud / 时间同步（fake-ip 会导致掉线或时间漂移）
    - '+.push.apple.com'
    - '+.apple.com'
    - '+.icloud.com'
    - 'time.apple.com'
    - 'time-ios.apple.com'
    # NTP / STUN（fake-ip 会破坏 UDP 打洞与时间校准）
    - '+.ntp.org'
    - 'time.windows.com'
    - 'time.nist.gov'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - tls://8.8.4.4:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32

sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    # 小米米家（嗅探导致设备掉线）
    - "+.mi.com"
    - "+.io.mi.com"
    - "dlg.io.mi.com"
    # Apple 推送（嗅探导致 APNs 异常）
    - "+.push.apple.com"
    - "+.apple.com"
    - "+.icloud.com"
    # 局域网
    - "+.lan"
    - "+.local"

